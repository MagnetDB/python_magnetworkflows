name: Build and Deploy Docs

on:
  workflow_dispatch:
  # Uncomment the triggers below to enable automatic deployment:
  # push:
  #   branches: [master]
  #   paths:
  #     - "docs/**"
  #     - "python_magnetworkflows/**"
  #     - "pyproject.toml"

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          # Install python_magnetcooling from submodule when available
          if [ -f "python_magnetcooling/pyproject.toml" ]; then
            pip install -e ./python_magnetcooling
          fi
          pip install -e ".[docs]"

      - name: Build HTML documentation
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going -n"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

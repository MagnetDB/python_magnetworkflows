name: CI

on:
  workflow_dispatch:
  # Uncomment the triggers below to enable automatic CI:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy
        # feelpp stubs are not available; ignore_missing_imports is set in pyproject.toml
        run: mypy python_magnetworkflows/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          # Install python_magnetcooling from submodule when available
          if [ -f "python_magnetcooling/pyproject.toml" ]; then
            pip install -e ./python_magnetcooling
          fi
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

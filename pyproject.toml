[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-magnetworkflows"
version = "0.1.0"
description = "Python Magnet Workflows"
readme = "README.md"
license = {text = "MIT"}
keywords = ["python_magnetworkflows"]
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"},
    {name = "Romain Vallet", email = "romain.vallet@lncmi.cnrs.fr"},
    {name = "Jeremie Muzet", email = "jeremie.muzet@lncmi.cnrs.fr"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0,<2.0",
    "scipy>=1.11.0",
    "tabulate>=0.9.0",
    "nlopt>=2.7.0",
    "python-decouple>=3.6",
    "requests>=2.27.1",
    "natsort>=7.1.1",
    "pandas>=2.2.1",
    "iapws>=1.4.0",
    "statsmodels>=0.13.0",
    "matplotlib>=3.5.1",
    "seaborn>=0.11.2",
    "Pint>=0.17.1",
    # feelpp packages installed as system Debian packages
    # "feelpp>=0.102.1",
    # "feelpp-toolboxes>=0.102.1",
    # "feelpp-toolboxes-core>=0.102.1",
    # "feelpp-toolboxes-coefficientformpdes>=0.102.1",
    "visidata>=2.6.0",
    "python-magnetcooling",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/MagnetDB/python_magnetworkflows"
Repository = "https://github.com/MagnetDB/python_magnetworkflows"

[project.scripts]
python_magnetworkflows = "python_magnetworkflows.cli:main"
python_magnetworkflows_run = "python_magnetworkflows.run:main"

[tool.setuptools]
packages = ["python_magnetworkflows"]

[tool.setuptools.package-data]
python_magnetworkflows = ["**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long – enforced by formatter, not linter
    "B006",  # mutable default argument (widespread in argparse defaults)
    "B007",  # loop variable not used (has legitimate uses here)
]

[tool.ruff.lint.isort]
known-first-party = ["python_magnetworkflows"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # feel++ stubs are not available

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "feelpp: mark test as requiring the feelpp Debian system package (deselect with '-m not feelpp')",
    "slow: mark test as requiring real simulation data and significant runtime (deselect with '-m not slow')",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore:function ham\\(\\) is deprecated:DeprecationWarning",
]
